name: Build firmware

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run

      - name: Prepare complete ESP32 flash package
        run: |
          mkdir -p artifact
          cp .pio/build/esp32dev/firmware.bin artifact/firmware.bin
          cp .pio/build/esp32dev/bootloader.bin artifact/bootloader.bin
          cp .pio/build/esp32dev/partitions.bin artifact/partitions.bin
          BOOT_APP0="$(find "$HOME/.platformio/packages" -path '*/tools/partitions/boot_app0.bin' -print -quit)"
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" artifact/boot_app0.bin
          cat > artifact/flash_args.txt <<'EOF'
          0x1000 bootloader.bin
          0x8000 partitions.bin
          0xe000 boot_app0.bin
          0x10000 firmware.bin
          EOF
          printf 'Target: ESP32 Dev Module (ESP32 DevKit V1)\nPlatformIO environment: esp32dev\nFlash offsets: see flash_args.txt\n' > artifact/README.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: artifact/
          if-no-files-found: error
          retention-days: 30
