name: Build firmware

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run

      - name: Prepare firmware artifact
        run: |
          mkdir -p artifact
          cp .pio/build/esp32dev/firmware.bin artifact/firmware.bin
          cp .pio/build/esp32dev/bootloader.bin artifact/bootloader.bin
          cp .pio/build/esp32dev/partitions.bin artifact/partitions.bin
          if [ -f .pio/build/esp32dev/boot_app0.bin ]; then cp .pio/build/esp32dev/boot_app0.bin artifact/; fi
          printf 'Board: ESP32 Dev Module (esp32dev)\nFramework: Arduino via PlatformIO\n' > artifact/README.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: artifact/
          if-no-files-found: error
          retention-days: 30
